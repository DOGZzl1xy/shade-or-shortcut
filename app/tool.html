<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Tool</title>
<meta name="description" content="Pick two points in University City and compare the shortest and the coolest walk at any summer hour, with and without indoor passages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Space+Grotesk:wght@500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/site.css?v=510bf10">
<script>
  // a page cross-fade the browser skips (e.g. in a background tab) rejects its promises; nothing to do about it
  const quiet = (e) => { const t = e.viewTransition; if (t) [t.ready, t.finished, t.updateCallbackDone].forEach((q) => q.catch(() => {})); };
  addEventListener("pagereveal", quiet); addEventListener("pageswap", quiet);
</script>
<style>
  #map { position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; }
  #side { position: fixed; top: calc(var(--nav-h) + 14px); left: 14px; width: 320px; max-height: calc(100vh - var(--nav-h) - 28px);
    overflow-y: auto; z-index: 5; }
  #side h1 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 4px 0 4px; }
  .block { margin-top: 14px; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cmp th { font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); font-weight: 400; text-align: right; padding: 4px 0; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp td { text-align: right; padding: 5px 0; border-top: 1px solid var(--line); font-family: var(--mono); line-height: 1.3; }
  table.cmp td small { display: block; color: var(--dim); font-size: 11px; }
  table.cmp th + th, table.cmp td + td { padding-left: 10px; }
  table.cmp td { font-size: 12px; }
  .verdict { margin-top: 10px; font-size: 14px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 10px; background: var(--line); }
  .bar span { display: block; height: 100%; }
  .keys { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; font-size: 11px; color: var(--dim); }
  .keys i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .hint { font-size: 12px; color: var(--dim); margin: 0; }
  .ramp { height: 6px; border-radius: 3px; margin-top: 10px; background: linear-gradient(to right, #ff8a3d, #e9b36a, #6fb0c8, #35d0e0); }
  .ends { display: flex; justify-content: space-between; font: 10px var(--mono); color: var(--dim); }
  .pin { width: 26px; height: 26px; border-radius: 50%; background: #07080b; border: 2px solid #fff; color: #fff; cursor: grab;
    font: 12px/22px var(--mono); text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #status { font: 11px var(--mono); color: var(--dim); }
  @media (max-width: 760px) {
    #side { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; max-height: 46vh; }
    #side.collapsed #result > :not(.verdict) { display: none; }
    #side.collapsed .verdict { margin-top: 0; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="side" class="panel">
  <div class="label">University City · demo</div>
  <h1>Shortest or coolest?</h1>
  <p class="hint">Click two points, or drag A and B.</p>
  <div id="status">Loading…</div>
  <div class="msg keep" id="msg" role="status"></div>

  <div class="block" id="time"></div>
  <div class="ramp"></div><div class="ends"><span>sunny</span><span>shaded</span></div>

  <div class="block">
    <div class="label" style="margin-bottom:6px">Through buildings</div>
    <div class="seg" id="scen">
      <button data-s="outdoor">None</button>
      <button data-s="no_penncard" title="Only buildings that need no Penn ID">No ID needed</button>
      <button data-s="all" class="on">All</button>
    </div>
  </div>

  <div class="block keep" id="result" hidden>
    <table class="cmp">
      <thead><tr><th></th><th>length</th><th>sun</th><th>shade</th><th>indoor</th></tr></thead>
      <tbody>
        <tr><td><span class="legend-swatch ls-short"></span>Shortest</td><td id="s-len"></td><td id="s-sun"></td><td id="s-sh"></td><td id="s-in"></td></tr>
        <tr><td><span class="legend-swatch ls-cool"></span>Coolest</td><td id="c-len"></td><td id="c-sun"></td><td id="c-sh"></td><td id="c-in"></td></tr>
      </tbody>
    </table>
    <div class="bar" id="cbar"></div>
    <div class="keys"><span><i style="background:var(--sun)"></i>sun</span><span><i style="background:var(--tree)"></i>tree</span><span><i style="background:var(--bldg)"></i>building</span><span><i style="background:var(--indoor)"></i>indoor</span></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="block"><button class="ghost" id="swap">Swap A and B</button> <button class="ghost" id="reset">Clear</button></div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/tool.js?v=510bf10"></script>
</body>
</html>
