<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City map – Shade or Shortcut</title>
<meta name="description" content="Hour-by-hour sidewalk shade for all of Philadelphia, and where walks home have a cooler option.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Space+Grotesk:wght@500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/site.css?v=15e0ad9">
<script>
  // a page cross-fade the browser skips (e.g. in a background tab) rejects its promises; nothing to do about it
  const quiet = (e) => { const t = e.viewTransition; if (t) [t.ready, t.finished, t.updateCallbackDone].forEach((q) => q.catch(() => {})); };
  addEventListener("pagereveal", quiet); addEventListener("pageswap", quiet);
</script>
<style>
  #map { position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; }
  .ringlabel { font: 11px var(--mono); letter-spacing: 0.06em; color: #fff; background: rgba(7,8,11,0.85); padding: 2px 8px;
    border: 1px dashed rgba(255,255,255,0.7); border-radius: 10px; margin-bottom: 6px; white-space: nowrap; }
  .hollow { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--cool); vertical-align: -1px; margin-right: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="side" class="panel side">
  <h1>Sun and heat on every sidewalk</h1>
  <p class="hint">Zoom in to see each sidewalk. Click a grid cell or a station for its walks home. Pick the day and hour below the map.</p>

  <div class="block" id="measure"></div>
  <div class="block" id="legend"></div>

  <div class="block">
    <div class="label">500 m grid · walks from bus stops</div>
    <div class="chips" id="gridvar"></div>
    <div id="glegend" style="margin-top:10px"></div>
  </div>

  <div class="block">
    <label class="switch"><span class="label" style="margin:0">Rapid-transit stations</span><input type="checkbox" id="stations" checked></label>
    <div id="slegend" style="margin-top:8px"></div>
  </div>
  <p class="hint">Grid and stations: walks home of 300–800 m at 15:00, both days.</p>

  <div class="block details keep" id="focus" hidden>
    <div id="focus-info"></div>
    <button class="ghost" id="unfocus" style="margin-top:10px">Back to the whole city</button>
  </div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script type="module" src="js/map.js?v=15e0ad9"></script>
</body>
</html>
